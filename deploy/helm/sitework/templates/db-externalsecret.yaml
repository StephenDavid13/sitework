{{- /*
Database credentials from AWS Secrets Manager (the RDS-managed master secret) via External
Secrets Operator. Both objects are pre-install/pre-upgrade hooks so they exist before the
migration Job (weight 0) that needs the Secret; see migrations-job.yaml for the full order.

Hooks are not part of the release manifest: `helm uninstall` leaves them (and the Secret)
behind. creationPolicy Orphan keeps the live Secret when before-hook-creation deletes and
recreates the ExternalSecret on every upgrade, so running pods never lose their credentials.
*/ -}}
{{- with .Values.database.externalSecret }}
{{- if .enabled }}
{{- $component := dict "root" $ "component" "database" }}
{{- $storeName := printf "%s-secrets-manager" (include "sitework.fullname" $) }}
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: {{ $storeName }}
  labels:
    {{- include "sitework.labels" $component | nindent 4 }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-20"
    helm.sh/hook-delete-policy: before-hook-creation
spec:
  provider:
    aws:
      service: SecretsManager
      region: {{ required "database.externalSecret.region is required when database.externalSecret.enabled" .region | quote }}
      # No auth block: the ESO controller's own credentials (EKS Pod Identity) are used.
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ include "sitework.db.secretName" $ }}
  labels:
    {{- include "sitework.labels" $component | nindent 4 }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-10"
    helm.sh/hook-delete-policy: before-hook-creation
spec:
  refreshInterval: {{ .refreshInterval | quote }}
  secretStoreRef:
    kind: SecretStore
    name: {{ $storeName }}
  target:
    name: {{ include "sitework.db.secretName" $ }}
    creationPolicy: Orphan
    deletionPolicy: Retain
  data:
    {{- $secretArn := required "database.externalSecret.secretArn is required when database.externalSecret.enabled" .secretArn }}
    {{- range list "username" "password" }}
    - secretKey: {{ . }}
      remoteRef:
        key: {{ $secretArn | quote }}
        property: {{ . }}
    {{- end }}
{{- end }}
{{- end }}
