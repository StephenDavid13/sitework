{{- if .Values.api.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "sitework.api.serviceAccountName" . }}
  labels:
    {{- include "sitework.labels" (dict "root" $ "component" "api") | nindent 4 }}
  {{- with .Values.api.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
# The app never calls the Kubernetes API.
automountServiceAccountToken: false
{{- end }}
